name: CI

# Run checks only when application inputs change. Keep the event paths below
# in sync with the per-job filters in `changes`. See docs/ci.md for the policy.
#
# Scope: tests and frontend compilation only. Installer builds (Windows .exe/.msi, macOS .dmg) live in
# `release.yml` and fire on `v*` tags — nothing here produces a bundle.
#
# The backend matrix is deliberately Windows + macOS with no Linux leg: on
# ubuntu the tauri link step needs an apt install of libwebkit2gtk-4.1-dev,
# libgtk-3-dev and friends, and Linux is not a target this app ships (v1 is
# Windows-first; release.yml builds Windows + macOS only).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '.npmrc'
      - '.node-version'
      - '.nvmrc'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'vitest.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - '.env'
      - '.env.*'
      - 'src-tauri/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
      - '!**/*.mdx'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '.npmrc'
      - '.node-version'
      - '.nvmrc'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'vitest.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - '.env'
      - '.env.*'
      - 'src-tauri/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
      - '!**/*.mdx'

# This workflow publishes nothing, so the token needs no write scope.
# (release.yml is the one that needs `contents: write`.)
permissions:
  contents: read

# Superseded pushes to a PR branch should stop burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect affected checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Push: compare with the tip before the entire push, not HEAD^.
          # PR: the action uses the PR file list, including fork PRs.
          base: ${{ github.ref }}
          predicate-quantifier: some-with-excludes
          filters: |
              frontend:
                - 'src/**'
                - 'public/**'
                - 'index.html'
                - 'package.json'
                - 'package-lock.json'
                - 'npm-shrinkwrap.json'
                - '.npmrc'
                - '.node-version'
                - '.nvmrc'
                - 'tsconfig*.json'
                - 'vite.config.*'
                - 'vitest.config.*'
                - 'tailwind.config.*'
                - 'postcss.config.*'
                - '.env'
                - '.env.*'
                - '.github/workflows/ci.yml'
                - '!**/*.md'
                - '!**/*.mdx'
              backend:
                - 'src-tauri/**'
                - '.cargo/**'
                - 'Cargo.toml'
                - 'Cargo.lock'
                - 'rust-toolchain'
                - 'rust-toolchain.toml'
                - 'rustfmt.toml'
                - '.rustfmt.toml'
                - '.github/workflows/ci.yml'
                - '!**/*.md'
                - '!**/*.mdx'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        # `npm ci` is unusable in this repo: Tailwind v4's wasm fallback has
        # nested optional deps npm cannot fully lock cross-platform, so the
        # strict sync check fails. Full rationale in release.yml.
        run: npm install --no-audit --no-fund

      - name: Run vitest suite
        run: npm test

      - name: Check types and build frontend
        run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Backend tests (cargo)
    strategy:
      # A macOS-only failure should still report the Windows result, and vice
      # versa — same reasoning as release.yml.
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Run cargo test suite
        # No feature flags and no frontend build are needed here. Without the
        # custom-protocol feature, tauri-codegen takes its dev branch (driven by
        # `devUrl` in tauri.conf.json) and returns empty embedded assets, so it
        # never reads `frontendDist` — the gitignored `dist/` directory is
        # irrelevant to the Rust tests. That is what keeps this job independent
        # of the frontend job; adding `npm run build` "to be safe" would
        # reintroduce the coupling and roughly double this job's runtime.
        #
        # `--locked` turns silent Cargo.lock drift into a CI failure.
        working-directory: ./src-tauri
        run: cargo test --locked
